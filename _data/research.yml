pillars:
  - id: "diff-tau"
    title: "Simulation-based inference & high-dimensional inverse problems"
    image: "/assets/img/ink-wash-c/web/research-retrieval.webp"
    image_small: "/assets/img/ink-wash-c/web/research-retrieval-small.webp"
    image_width: 960
    image_height: 720
    image_variant: "compact"
    image_alt: "Watercolour ink and wash illustration of a host star and transiting ringed exoplanet"
    tags: ["Simulation-based inference", "Normalising flows", "Variational inference", "Differentiable physics", "Remote sensing & retrieval", "TauREx"]
    short_summary: >-
      Simulation-based inference, variational methods, normalising flows, and differentiable forward models for noisy inverse problems.
    linked_summary: >-
      Building on the open source <a href="https://taurex.space" target="_blank" rel="noopener">TauREx</a> framework that we co-develop, we design simulation-based inference (SBI), variational methods, and normalising flows alongside differentiable forward models for rapid, amortised Bayesian posterior estimation from noisy remote-sensing and spectroscopic instruments.
    summary: >-
      Building on the open source TauREx framework that we co-develop, we design simulation-based inference (SBI), variational methods, and normalising flows alongside differentiable forward models for rapid, amortised Bayesian posterior estimation from noisy remote-sensing and spectroscopic instruments.
    key_papers:
      - "Retrieving Exoplanetary Spectra with Variational Inference and Normalising Flows (Yip et al., ApJ 2024)"
      - "The effect of spectroscopic binning on atmospheric retrievals (Davey, Yip et al., MNRAS 2025)"
      - "Integrating Light Curve and Atmospheric Modeling of Transiting Exoplanets (Yip et al., AJ 2020)"

  - id: "chexanet"
    title: "Physics-informed neural surrogates & 3D simulation emulation"
    image: "/assets/img/ink-wash-c/web/research-surrogates.webp"
    image_small: "/assets/img/ink-wash-c/web/research-surrogates-small.webp"
    image_width: 960
    image_height: 480
    image_variant: "panoramic"
    image_alt: "Watercolour ink and wash illustration of a neural network graph connecting planetary atmosphere grids"
    tags: ["AI for Science", "Neural surrogates", "Physics-informed ML", "3D fluid & radiative simulation", "Chemical network emulation"]
    short_summary: >-
      Physics-informed neural surrogates accelerating 3D fluid, radiative, and chemical simulators.
    linked_summary: >-
      We design physics-informed neural surrogates that emulate complex radiative transfer, chemical networks, and multidimensional fluid and atmospheric dynamics at orders-of-magnitude higher speed than numerical solvers.
    summary: >-
      We design physics-informed neural surrogates that emulate complex radiative transfer, chemical networks, and multidimensional fluid and atmospheric dynamics at orders-of-magnitude higher speed than numerical solvers.
    key_papers:
      - "Graph Neural Networks For Exoplanets Atmospheres (Vojteková, Yip et al., arXiv 2026)"
      - "CHEXANET: accelerating disequilibrium chemistry calculations using neural networks (Vojteková, Waldmann, Yip et al., MNRAS 2025)"
      - "Enhancing 3D planetary atmosphere simulations with surrogate modeling (Tahseen, Mendonça, Yip & Waldmann, MNRAS 2024)"

  - id: "black-box"
    title: "Trustworthy scientific AI, benchmarking & uncertainty calibration"
    image: "/assets/img/ink-wash-c/web/research-interpretability.webp"
    image_small: "/assets/img/ink-wash-c/web/research-interpretability-small.webp"
    image_width: 960
    image_height: 480
    image_variant: "panoramic"
    image_alt: "Watercolour ink and wash illustration of feature inspection inside a neural network"
    tags: ["AI evaluation & safety", "Calibrated uncertainty", "Out-of-distribution diagnostics", "Explainable AI", "Stress-testing under noise"]
    short_summary: >-
      Explainable AI, out-of-distribution failure diagnostics, and calibrated uncertainty quantification for high-stakes scientific and sensor pipelines.
    linked_summary: >-
      We investigate how deep learning models represent physical principles and fail under distribution shift, developing explainability tools, out-of-distribution diagnostics, and calibrated uncertainty quantification so ML inference remains transparent and reliable under real observational and sensor noise.
    summary: >-
      We investigate how deep learning models represent physical principles and fail under distribution shift, developing explainability tools, out-of-distribution diagnostics, and calibrated uncertainty quantification so ML inference remains transparent and reliable under real observational and sensor noise.
    key_papers:
      - "Interpreting atmospheric neural networks: insights from explainable AI (Vojteková, Nikolaou, Yip et al., RASTI 2026)"
      - "NeurIPS Ariel Data Challenge 2024: Characterization of Exoplanetary Atmospheres (Yip et al., NeurIPS Track 2025)"
      - "Peeking inside the Black Box: Interpreting Deep Learning Models for Retrievals (Yip et al., AJ 2021)"
